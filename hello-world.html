<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10101d">
  <title>Hello, World! — A Little Moment of Magic</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f7ff;
      --muted: #b6b4ca;
      --glass: rgba(255, 255, 255, .075);
      --line: rgba(255, 255, 255, .16);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10101d;
      background-image:
        radial-gradient(ellipse at 18% 18%, rgba(119, 92, 255, .36), transparent 34%),
        radial-gradient(ellipse at 82% 78%, rgba(255, 111, 166, .25), transparent 32%),
        radial-gradient(ellipse at 70% 12%, rgba(63, 203, 227, .16), transparent 28%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .25;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
    }
    .scene { width: min(100% - 2rem, 760px); position: relative; }
    .sparkle { position: absolute; color: #fff; opacity: .7; animation: twinkle 3s ease-in-out infinite; }
    .sparkle.one { top: -2rem; left: 12%; font-size: 1.5rem; }
    .sparkle.two { top: 15%; right: -1rem; font-size: 1rem; animation-delay: 1s; }
    .sparkle.three { bottom: 5%; left: -1.5rem; font-size: 1.2rem; animation-delay: 1.7s; }
    .card {
      position: relative;
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
      box-shadow: 0 32px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(22px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .55rem .9rem; border: 1px solid var(--line); border-radius: 999px;
      color: #d7d3f4; background: rgba(255,255,255,.045);
      font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    }
    .eyebrow::before { content: "✦"; color: #ffce78; font-size: .9rem; }
    h1 {
      margin: 1.55rem 0 1rem;
      font-size: clamp(3.8rem, 12vw, 7.6rem);
      line-height: .94; letter-spacing: -.085em; font-weight: 800;
    }
    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #a99aff 8%, #f5a8d6 53%, #ffd28b 92%);
      background-clip: text; -webkit-background-clip: text;
      filter: drop-shadow(0 10px 34px rgba(190,130,255,.22));
    }
    p { max-width: 34rem; margin: 0 auto; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.18rem); line-height: 1.75; }
    .rule { width: 54px; height: 2px; margin: 2rem auto 1.55rem; border-radius: 5px; background: linear-gradient(90deg, #a99aff, #ff9fc6); }
    .signature { color: #e9e5fa; font-size: .82rem; letter-spacing: .04em; }
    .signature b { color: #ffbd91; font-weight: 600; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes twinkle { 0%, 100% { transform: scale(.8) rotate(-10deg); opacity: .35; } 50% { transform: scale(1.15) rotate(12deg); opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <span class="sparkle one" aria-hidden="true">✦</span>
    <span class="sparkle two" aria-hidden="true">✧</span>
    <span class="sparkle three" aria-hidden="true">✧</span>
    <section class="card" aria-labelledby="greeting">
      <div class="eyebrow">A tiny beginning</div>
      <h1 id="greeting">Hello,<span>world! my name is inioluwa</span></h1>
      <div class="rule" aria-hidden="true"></div>
      <p>Every great idea starts somewhere. Here’s to curious minds, fresh starts, and all the lovely things still waiting to happen.</p>
      <div class="rule" aria-hidden="true"></div>
      <div class="signature">Made with <b>✦</b> and a  imagination</div>
    </section>
  </main>
</body>
</html>
